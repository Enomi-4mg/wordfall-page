<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordfall Local Editor</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="editor.css?v=ui-alignment-v1">
</head>
<body>
  <main class="editor-shell">
    <aside class="list-pane" aria-label="Word list">
      <header class="pane-header">
        <div>
          <p class="kicker">Wordfall</p>
          <h1>Local Editor</h1>
        </div>
        <button id="newButton" class="icon-button" type="button" aria-label="Add word">
          <i data-lucide="plus"></i>
        </button>
      </header>

      <div class="filters">
        <label class="field-label" for="searchInput">検索</label>
        <input id="searchInput" class="control-input" type="search" placeholder="name / reading / desc">
        <div class="filter-toolbar">
          <button id="filterButton" class="text-button" type="button" aria-expanded="false" aria-controls="filterPanel">
            <i data-lucide="list-filter"></i>
            <span>絞り込み</span>
            <span id="filterCount" class="filter-count">全件</span>
          </button>
        </div>
        <div id="filterPanel" class="filter-panel" hidden>
          <div class="filter-panel-header">
            <strong>一覧設定</strong>
            <button id="resetFiltersButton" class="text-button compact-text-button" type="button">リセット</button>
          </div>
          <div class="filter-sort-row">
            <label class="filter-control">
              <span>並び順</span>
              <select id="sortSelect" class="control-input">
                <option value="lang">言語</option>
                <option value="genre">ジャンル</option>
                <option value="lv">レベル</option>
                <option value="name">名前</option>
                <option value="createdAt">登録日</option>
              </select>
            </label>
            <button id="sortDirectionButton" class="icon-button" type="button" aria-label="昇順" title="昇順">
              <i data-lucide="arrow-down-a-z"></i>
            </button>
          </div>
          <fieldset class="filter-group">
            <legend>言語</legend>
            <div id="languageFilters" class="filter-options"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>ジャンル</legend>
            <div id="genreFilters" class="filter-options"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>レベル</legend>
            <div id="levelFilters" class="filter-options"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>desc</legend>
            <div class="filter-options filter-options-inline">
              <label class="check-option"><input type="radio" name="descFilter" value="all" checked><span>すべて</span></label>
              <label class="check-option"><input type="radio" name="descFilter" value="has"><span>あり</span></label>
              <label class="check-option"><input type="radio" name="descFilter" value="missing"><span>なし</span></label>
            </div>
          </fieldset>
          <fieldset class="filter-group">
            <legend>登録日</legend>
            <div class="date-filter-row">
              <label class="filter-control"><span>From</span><input id="createdFromInput" class="control-input mono" type="date"></label>
              <label class="filter-control"><span>To</span><input id="createdToInput" class="control-input mono" type="date"></label>
            </div>
          </fieldset>
        </div>
      </div>

      <div id="wordList" class="word-list"></div>
    </aside>

    <section class="form-pane" aria-label="Word form">
      <header class="form-header">
        <div>
          <p id="formMode" class="kicker">Select</p>
          <h2 id="formTitle">語を選択</h2>
        </div>
        <div class="form-actions">
          <button id="discardButton" class="text-button" type="button" hidden disabled>
            <i data-lucide="rotate-ccw"></i>
            <span>破棄</span>
          </button>
          <button id="deleteButton" class="text-button danger" type="button" disabled>
            <i data-lucide="trash-2"></i>
            <span>削除</span>
          </button>
        </div>
      </header>

      <form id="wordForm" class="word-form">
        <label>
          <span>name</span>
          <input id="nameInput" class="control-input" name="name" required>
        </label>
        <label>
          <span>reading</span>
          <input id="readingInput" class="control-input" name="reading">
        </label>
        <label>
          <span>desc</span>
          <textarea id="descInput" class="control-input textarea" name="desc"></textarea>
        </label>
        <div class="two-column">
          <label>
            <span>lang</span>
            <select id="langSelect" class="control-input" name="lang" required></select>
          </label>
          <label>
            <span>lv</span>
            <select id="lvSelect" class="control-input" name="lv">
              <option value="">-</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>
        <label>
          <span>genre</span>
          <select id="genreSelect" class="control-input" name="genre"></select>
        </label>
        <label>
          <span>登録日</span>
          <input id="createdAtInput" class="control-input mono" name="createdAt" readonly>
        </label>
        <section class="editor-section" aria-labelledby="usageHeading">
          <div class="editor-section-header">
            <div>
              <p class="section-kicker">Examples</p>
              <h3 id="usageHeading">用法用例</h3>
            </div>
            <button id="addUsageButton" class="icon-button" type="button" aria-label="用法用例を追加" title="用法用例を追加">
              <i data-lucide="plus"></i>
            </button>
          </div>
          <div id="usageList" class="usage-list"></div>
        </section>
        <section class="editor-section" aria-labelledby="linksHeading">
          <button id="linksEditorToggle" class="accordion-toggle" type="button" aria-expanded="false" aria-controls="linksEditorPanel">
            <span>
              <span class="section-kicker">Sites</span>
              <strong id="linksHeading">サイトリンクを編集</strong>
            </span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div id="linksEditorPanel" class="links-editor-panel" hidden>
            <div id="siteLinkList" class="site-link-list"></div>
            <div class="links-editor-actions">
              <button id="addSiteButton" class="text-button" type="button">
                <i data-lucide="plus"></i>
                <span>サイトを追加</span>
              </button>
              <button id="linksDoneButton" class="text-button primary" type="button">完了</button>
            </div>
          </div>
        </section>
        <label>
          <span>id</span>
          <input id="idInput" class="control-input mono" name="id" readonly>
        </label>
        <div id="validationMessages" class="validation-messages"></div>
      </form>
    </section>
  </main>

  <footer class="bottom-bar">
    <div id="dirtyStatus" class="dirty-status">No changes</div>
    <div class="bar-actions">
      <button id="undoButton" class="icon-button" type="button" aria-label="Undo" title="Undo" disabled>
        <i data-lucide="undo-2"></i>
      </button>
      <button id="redoButton" class="icon-button" type="button" aria-label="Redo" title="Redo" disabled>
        <i data-lucide="redo-2"></i>
      </button>
      <button id="chooseFolderButton" class="text-button" type="button">
        <i data-lucide="folder-open"></i>
        <span>dataフォルダ</span>
      </button>
      <button id="saveButton" class="text-button primary" type="button" disabled>
        <i data-lucide="save"></i>
        <span>保存</span>
      </button>
    </div>
  </footer>

  <script type="module" src="editor.js?v=examples-links-history-v2"></script>
</body>
</html>
