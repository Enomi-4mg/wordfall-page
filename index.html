<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="言葉が静かに落ちてくる鑑賞型Webページ。">
  <title>Wordfall</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-label="Wordfall">
    <section id="wordCascade" class="word-cascade" aria-label="落ちてくる言葉"></section>

    <div class="top-controls" aria-label="Controls">
      <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel">
        <i data-lucide="settings"></i>
      </button>
      <button id="soundButton" class="icon-button" type="button" aria-label="Turn sound on" aria-pressed="false">
        <i data-lucide="volume-x"></i>
      </button>
      <button id="infoButton" class="icon-button" type="button" aria-label="Open information" aria-haspopup="dialog" aria-expanded="false" aria-controls="infoDialog">
        <i data-lucide="info"></i>
      </button>
    </div>

    <div class="popover-stack">
      <div id="settingsPanel" class="popover" role="dialog" aria-label="Settings" aria-hidden="true" tabindex="-1" inert>
        <p class="popover-title">Sound</p>
        <label class="field-label" for="audioSourceSelect">音源</label>
        <select id="audioSourceSelect" class="select-input">
          <option value="generated">Generated noise</option>
          <option value="file">Audio file</option>
        </select>
        <label class="field-label" for="volumeSlider">音量 <span id="volumeValue">35%</span></label>
        <input id="volumeSlider" class="range-input" type="range" min="0" max="1" step="0.01" value="0.35">
      </div>

      <div id="infoDialog" class="popover popover-wide" role="dialog" aria-label="Information" aria-hidden="true" tabindex="-1" inert>
        <p class="popover-title">Wordfall</p>
        <p class="popover-text">言葉が静かに落ちてくるページです。気になった言葉を選ぶと、短い説明と検索への入口が開きます。</p>
        <a id="formsLink" class="text-button primary" href="https://docs.google.com/forms/d/e/1FAIpQLScQgEK_keyP4dlT2oEpgExAKFNpHAql7iXq7Nmpwxrpi7uZ4w/viewform" target="_blank" rel="noopener noreferrer">
          <i data-lucide="send"></i>
          <span>言葉を投稿する</span>
        </a>
      </div>
    </div>

    <div id="statusMessage" class="status-message" role="status"></div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true" inert>
    <article id="detailModal" class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modalWord" tabindex="-1">
      <button id="closeModalButton" class="icon-button compact modal-close" type="button" aria-label="Close detail">
        <i data-lucide="x"></i>
      </button>
      <div class="modal-meta">
        <span id="modalLevel"></span>
        <span id="modalGenre"></span>
      </div>
      <h2 id="modalWord"></h2>
      <p id="modalReading" class="modal-reading"></p>
      <p id="modalDesc" class="modal-desc"></p>
      <div class="modal-actions">
        <button id="googleButton" class="text-button" type="button">
          <i data-lucide="search"></i>
          <span>Google</span>
        </button>
        <button id="wikiButton" class="text-button" type="button">
          <i data-lucide="book-open"></i>
          <span>Wikipedia</span>
        </button>
      </div>
    </article>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
